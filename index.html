<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FF6417'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Nguyen Duy Trang — Mobile Engineer Portfolio</title>
    <meta name="description" content="Portfolio of Nguyen Duy Trang — Mobile Engineer with 5+ years of experience in Flutter, Native iOS (Swift), and Android (Kotlin)." />
    <meta name="keywords" content="Nguyen Duy Trang, Mobile Engineer, Flutter Developer, iOS Developer, Android Developer, AstroBite, Clean Architecture" />
    <meta property="og:title" content="Nguyen Duy Trang — Mobile Engineer Portfolio" />
    <meta property="og:description" content="Mobile Engineer with 5+ years of experience in Flutter and Native iOS/Android (Hahalolo, Finviet ECO POS, AstroBite)." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#08090A" />
    
    <!-- Google Fonts: Newsreader & Playfair Display (Full Vietnamese Editorial Serif), Geist, Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400..800;1,6..72,400..800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Pre-hydration Theme & Language Detection Script: Default to dark void cinematic mode & English -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('portfolio-theme');
          if (savedTheme === 'light') {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }

          // Purge stale legacy key that was cached in visitor browsers
          if (localStorage.getItem('portfolio_lang')) {
            localStorage.removeItem('portfolio_lang');
          }

          var urlParams = new URLSearchParams(window.location.search);
          var paramLang = urlParams.get('lang');
          var savedLang = localStorage.getItem('portfolio_language');
          var activeLang = (paramLang === 'vi' || paramLang === 'en') ? paramLang : (savedLang === 'vi' || savedLang === 'en' ? savedLang : 'en');
          document.documentElement.lang = activeLang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#08090A] text-[#F4F2EA] antialiased selection:bg-[#FF6417]/30 selection:text-[#FFF4DE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
